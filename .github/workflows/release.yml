# Build the installers on GitHub's machines and attach them to a release.
#
# Triggered by pushing a version tag:
#
#     git tag v0.1.0
#     git push origin v0.1.0
#
# or by hand from the Actions tab, which builds the installers without making
# a release (useful for checking a change compiles before you tag it).
#
# This repository is private, so build time is metered. Linux costs one minute
# per minute; a Windows machine costs two and a Mac costs ten. That is why this
# only runs on tags, and why the other two platforms are not here yet -- add
# them when you actually need them, not before.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux (.deb)
    # Deliberately not ubuntu-latest. A package built on 24.04 will not install
    # on an older machine; built on 22.04 it installs on both.
    runs-on: ubuntu-22.04

    steps:
      - name: Check out the source
        uses: actions/checkout@v4
        with:
          # examples/ is 433 MB of quantum-chemistry output that only the tests
          # read, and only at run time -- nothing is needed to compile. Leaving
          # it out saves minutes on every single run. In cone mode the files at
          # the repository root (Cargo.toml, Cargo.lock, LICENSE, README.md)
          # come along automatically.
          sparse-checkout: |
            src
            tests
            packaging
          fetch-depth: 1

      - name: Install what Bevy needs to compile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libudev-dev pkg-config

      - name: Cache the crate registry
        uses: actions/cache@v4
        with:
          # Only the downloaded crates, not target/. A release build of Bevy
          # produces several gigabytes of build output, which would crowd out
          # the repository's whole cache allowance for very little gain on a
          # workflow that runs a few times a year.
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Show the toolchain being used
        run: |
          rustc --version
          cargo --version

      - name: Check the tag matches the version in Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          crate_version="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          tag_version="${GITHUB_REF_NAME#v}"
          if [ "$crate_version" != "$tag_version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME says $tag_version but Cargo.toml says $crate_version."
            echo "::error::Bump the version in Cargo.toml, commit, then move the tag."
            exit 1
          fi
          echo "version $crate_version matches tag $GITHUB_REF_NAME"

      - name: Build the package
        run: ./packaging/build-deb.sh

      - name: Check the package is well formed
        run: |
          deb="$(ls target/deb/*.deb)"
          echo "built: $deb  ($(du -h "$deb" | cut -f1))"
          dpkg-deb --info "$deb"
          dpkg-deb --contents "$deb"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: beavyr-deb
          path: target/deb/*.deb
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish the release
    needs: [linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04

    steps:
      - name: Collect every installer
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List what will be published
        run: ls -la dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Beavyr $GITHUB_REF_NAME" \
            --generate-notes \
            dist/*
