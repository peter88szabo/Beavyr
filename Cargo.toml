[package]
name = "Beavyr"
version = "0.2.1"
edition = "2021"

[features]
# `dev` keeps Bevy's dynamic linking on for fast incremental builds.
# It is on by default so plain `cargo run` stays fast.
# Ship standalone binaries with: cargo build --release --no-default-features
default = ["dev"]
dev = ["bevy/dynamic_linking"]

[dependencies]
# Keep Bevy's rendering/UI defaults, but omit its audio feature and ALSA dependency.
bevy = { version = "0.19.1", default-features = false, features = ["2d", "3d", "ui", "jpeg", "serialize"] }
bevy_egui = "0.42.0"
# Portable projects and reusable fragments; egui persistence keeps window layouts.
egui = { version = "0.36.1", features = ["persistence"] }
serde = { version = "1.0", features = ["derive"] }
ron = "0.12.2"
rfd = "0.17"

# Imported frequency-analysis code from the Behemoth project uses these two.
# Both are pure Rust: `ndarray-linalg` (which would need a system BLAS) is
# deliberately NOT used -- see docs/superpowers/specs/2026-09-04-frequency-analysis-design.md
ndarray = { version = "0.15", features = ["serde"] }
anyhow = "1.0"
pdbtbx = { version = "0.12.0", default-features = false, features = ["compression"] }
dunbrack = "0.1.0"

# Our own code stays cheap to rebuild, but Bevy/wgpu/glam must be optimised or
# the viewer is unusably slow in a dev build.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
